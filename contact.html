            <section id="contact-form">
                <h2>Leave a message</h2>
                <form action="submit_form.php" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label>Reason for the message:</label>
                    <input type="radio" id="info" name="motivo" value="info" required>
                    <label for="info">Request general information</label>

                    <input type="radio" id="booking" name="motivo" value="booking">
                    <label for="booking">Question about booking</label>

                    <input type="radio" id="suggestions" name="reason" value="suggestions">
                    <label for="suggestions">Site Suggestion</label>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Sign me up for the monthly newsletter</label>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </main>
